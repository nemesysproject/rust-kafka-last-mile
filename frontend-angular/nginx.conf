# =============================================================================
# SwiftRoute Last-Mile · Frontend Reverse Proxy & Security Hardening (Nginx)
# =============================================================================
# Mitigaciones aplicadas en capa Frontend:
#   1. Rate Limiting para peticiones al SPA y proxies de API
#   2. Limite de conexiones concurrentes y tamano maximo de cuerpo (64KB)
#   3. Content-Security-Policy (CSP), X-Frame-Options (Anti-Clickjacking),
#      X-Content-Type-Options (Anti-MIME Sniffing), Referrer-Policy
#   4. Reglas WAF contra SQLi, XSS, Path Traversal y scanners automatizados
#   5. Enrutamiento hacia backend-proxy (sin exponer credenciales de Airflow en JS)
# =============================================================================

server_tokens off;

limit_req_zone  $binary_remote_addr zone=frontend_spa_rate:10m rate=40r/s;
limit_req_zone  $binary_remote_addr zone=frontend_api_rate:10m rate=20r/s;
limit_conn_zone $binary_remote_addr zone=frontend_conn_limit:10m;

server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # 1. Limites de payload y timeouts contra Slowloris
    client_max_body_size 64k;
    client_body_buffer_size 16k;
    client_body_timeout 10s;
    client_header_timeout 10s;
    keepalive_timeout 30s;
    send_timeout 10s;

    # 2. Cabeceras de Seguridad Defensivas en Frontend
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' https://unpkg.com; style-src 'self' 'unsafe-inline' https://unpkg.com; font-src 'self' data:; img-src 'self' data: https://*.basemaps.cartocdn.com https://*.tile.openstreetmap.org; connect-src 'self' http://localhost:8080 http://localhost:4200; frame-ancestors 'self';" always;

    # 3. Bloquear metodos HTTP no permitidos
    if ($request_method !~ ^(GET|POST|OPTIONS|HEAD)$) {
        return 405;
    }

    # 4. Bloquear scanners y herramientas de ataque por User-Agent
    if ($http_user_agent ~* "(sqlmap|nikto|nmap|masscan|dirbuster|gobuster|acunetix|nessus|openvas|havij)") {
        return 403;
    }

    # 5. Bloquear Path Traversal y archivos ocultos (.git, .env, etc.)
    if ($request_uri ~* "(\.\./|\.\.\\|%2e%2e%2f|%252e|%00)") {
        return 403;
    }
    location ~ /\.(?!well-known) {
        deny all;
        return 404;
    }

    # 6. Bloquear SQLi y XSS reflejado en Query Strings
    if ($query_string ~* "(union.*select|select.*from|insert.*into|drop.*table|update.*set|delete.*from|<script|%3Cscript|javascript:|onerror=|onload=)") {
        return 403;
    }

    # 7. Rutas del SPA Angular 21
    location / {
        limit_req zone=frontend_spa_rate burst=60 nodelay;
        limit_conn frontend_conn_limit 30;
        try_files $uri $uri/ /index.html;
    }

    # 8. Proxy hacia el Reverse Proxy del Backend para Stream SSE
    location /api/sse/ {
        limit_conn frontend_conn_limit 15;
        proxy_pass http://backend-proxy:8080/api/sse/;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 86400s;
    }

    # 9. Proxy hacia el Reverse Proxy del Backend (Rust Core API + Swagger)
    location /api/ {
        limit_req zone=frontend_api_rate burst=30 nodelay;
        limit_conn frontend_conn_limit 25;
        proxy_pass http://backend-proxy:8080/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # 10. Proxy seguro hacia Airflow a traves del Backend Proxy (sin credenciales en el cliente Angular)
    location /airflow-api/ {
        limit_req zone=frontend_api_rate burst=15 nodelay;
        limit_conn frontend_conn_limit 10;
        proxy_pass http://backend-proxy:8080/api/airflow/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}
