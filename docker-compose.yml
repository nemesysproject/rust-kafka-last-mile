services:
  # 1. Base de Datos (Persistencia de negocio + Metadatos de Airflow)
  postgres:
    image: postgres:16-alpine
    container_name: swiftroute-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?Defina POSTGRES_USER en .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Defina POSTGRES_PASSWORD en .env}
      POSTGRES_DB: ${POSTGRES_DB:?Defina POSTGRES_DB en .env}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infra/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

  # 2. Apache Kafka (Modo KRaft sin Zookeeper · Endurecido con Dual Listeners)
  kafka:
    image: apache/kafka:3.8.0
    container_name: swiftroute-kafka
    ports:
      - "127.0.0.1:9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://:29092,EXTERNAL://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,EXTERNAL://localhost:9092
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_NUM_PARTITIONS: 3
      KAFKA_LOG_RETENTION_HOURS: 168
      KAFKA_MESSAGE_MAX_BYTES: 65536
    healthcheck:
      test: ["CMD-SHELL", "nc -z localhost 9092 || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 25s

  # 2.1 Inicializador de Topicos Kafka (Se ejecuta una sola vez tras arrancar Kafka)
  kafka-init:
    image: apache/kafka:3.8.0
    container_name: swiftroute-kafka-init
    entrypoint: /bin/bash
    command:
      - -c
      - |
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:29092 --create --if-not-exists --topic gps-telemetry --partitions 3 --replication-factor 1 &&
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:29092 --create --if-not-exists --topic route-alerts --partitions 3 --replication-factor 1
    depends_on:
      kafka:
        condition: service_healthy

  # 3. Core API & Stream Processor (Rust · Red Interna protegida por backend-proxy)
  backend-rust:
    build:
      context: ./backend-rust
      dockerfile: Dockerfile
    container_name: swiftroute-rust-api
    expose:
      - "8080"
    environment:
      KAFKA_BROKERS: ${KAFKA_BROKERS:-kafka:29092}
      DATABASE_URL: ${DATABASE_URL:?Defina DATABASE_URL en .env}
      RUST_LOG: ${RUST_LOG:-info}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:4200,http://localhost:8080}
      MAX_TRACKED_DRIVERS: ${MAX_TRACKED_DRIVERS:-500}
      SWIFTROUTE_API_KEY: ${SWIFTROUTE_API_KEY:?Defina SWIFTROUTE_API_KEY en .env}
    depends_on:
      kafka:
        condition: service_healthy
      postgres:
        condition: service_healthy

  # 4. Apache Airflow (Standalone · Credenciales inyectadas desde .env)
  airflow:
    build:
      context: ./orchestrator-airflow
      dockerfile: Dockerfile
    container_name: swiftroute-airflow
    ports:
      - "8081:8080"
    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: ${AIRFLOW_SQLALCHEMY_CONN:?Defina AIRFLOW_SQLALCHEMY_CONN en .env}
      SWIFTROUTE_DB_URL: ${SWIFTROUTE_DB_URL:?Defina SWIFTROUTE_DB_URL en .env}
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__API__AUTH_BACKENDS: airflow.api.auth.backend.basic_auth
      AIRFLOW__WEBSERVER__SECRET_KEY: ${AIRFLOW_SECRET_KEY:?Defina AIRFLOW_SECRET_KEY en .env}
      AIRFLOW__WEBSERVER__ENABLE_PROXY_FIX: "True"
      AIRFLOW__API__ACCESS_CONTROL_ALLOW_HEADERS: "Content-Type, Authorization, X-API-Key"
      AIRFLOW__API__ACCESS_CONTROL_ALLOW_METHODS: "GET, POST, OPTIONS"
      AIRFLOW__API__ACCESS_CONTROL_ALLOW_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:4200,http://localhost:8080}
      _AIRFLOW_WWW_USER_CREATE: "true"
      _AIRFLOW_WWW_USER_USERNAME: ${AIRFLOW_ADMIN_USER:?Defina AIRFLOW_ADMIN_USER en .env}
      _AIRFLOW_WWW_USER_PASSWORD: ${AIRFLOW_ADMIN_PASSWORD:?Defina AIRFLOW_ADMIN_PASSWORD en .env}
      _AIRFLOW_WWW_USER_EMAIL: ${AIRFLOW_ADMIN_EMAIL:-admin@swiftroute.local}
    volumes:
      - ./orchestrator-airflow/dags:/opt/airflow/dags
      - ./orchestrator-airflow/scripts:/opt/airflow/scripts
    entrypoint: /bin/bash
    command:
      - -c
      - |
        airflow db migrate &&
        airflow users create --username "$${_AIRFLOW_WWW_USER_USERNAME}" --password "$${_AIRFLOW_WWW_USER_PASSWORD}" --firstname Admin --lastname SwiftRoute --role Admin --email "$${_AIRFLOW_WWW_USER_EMAIL}" ||
        airflow users reset-password -u "$${_AIRFLOW_WWW_USER_USERNAME}" -p "$${_AIRFLOW_WWW_USER_PASSWORD}" &&
        exec airflow standalone
    depends_on:
      postgres:
        condition: service_healthy

  # 5. Reverse Proxy & WAF Layer del Backend (Inyecta secretos desde .env via template envsubst)
  backend-proxy:
    image: nginx:1.31.9-alpine
    container_name: swiftroute-backend-proxy
    ports:
      - "8080:8080"
    environment:
      AIRFLOW_BASIC_AUTH_B64: ${AIRFLOW_BASIC_AUTH_B64:?Defina AIRFLOW_BASIC_AUTH_B64 en .env}
      SWIFTROUTE_API_KEY: ${SWIFTROUTE_API_KEY:?Defina SWIFTROUTE_API_KEY en .env}
      NGINX_ENVSUBST_FILTER: "^(AIRFLOW_BASIC_AUTH_B64|SWIFTROUTE_API_KEY)$"
    volumes:
      - ./infra/proxy/backend-proxy.conf:/etc/nginx/templates/default.conf.template:ro
    depends_on:
      - backend-rust
      - airflow

  # 6. Dashboard de Monitoreo (Angular 21 + Reverse Proxy & WAF Layer del Frontend)
  frontend-angular:
    build:
      context: ./frontend-angular
      dockerfile: Dockerfile
    container_name: swiftroute-angular-ui
    ports:
      - "4200:80"
    depends_on:
      - backend-proxy

volumes:
  postgres_data:
