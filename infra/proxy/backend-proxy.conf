# =============================================================================
# SwiftRoute Last-Mile · Backend Reverse Proxy & WAF Layer (Nginx 1.27)
# =============================================================================
# NOTA: Este archivo es procesado por envsubst al iniciar el contenedor
#       swiftroute-backend-proxy, inyectando ${AIRFLOW_BASIC_AUTH_B64} y
#       ${SWIFTROUTE_API_KEY} desde .env sin exponer secretos en el repositorio.
# =============================================================================

server_tokens off;

# Lista blanca de origenes permitidos en el Reverse Proxy del Backend
map $http_origin $cors_allow_origin {
    default "";
    "http://localhost:4200" "http://localhost:4200";
    "http://127.0.0.1:4200" "http://127.0.0.1:4200";
    "http://localhost:8080" "http://localhost:8080";
}

# Zonas de Rate Limiting y Concurrencia en memoria compartida
limit_req_zone  $binary_remote_addr zone=backend_api_rate:10m   rate=30r/s;
limit_req_zone  $binary_remote_addr zone=backend_write_rate:10m rate=10r/s;
limit_conn_zone $binary_remote_addr zone=backend_conn_limit:10m;

upstream rust_core_upstream {
    server backend-rust:8080;
    keepalive 32;
}

upstream airflow_internal_upstream {
    server airflow:8080;
    keepalive 16;
}

server {
    listen 8080;
    server_name localhost;

    # 1. Limites de buffer y tamano de cuerpo HTTP (64KB max para JSON GPS)
    client_max_body_size 64k;
    client_body_buffer_size 16k;
    client_header_buffer_size 2k;
    large_client_header_buffers 4 8k;
    client_body_timeout 10s;
    client_header_timeout 10s;

    # 2. Cabeceras de seguridad HTTP y Control de Acceso CORS centralizado en el Proxy
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header Access-Control-Allow-Origin $cors_allow_origin always;
    add_header Access-Control-Allow-Methods "GET, POST, OPTIONS" always;
    add_header Access-Control-Allow-Headers "Content-Type, Authorization, X-API-Key" always;
    add_header Access-Control-Max-Age 86400 always;

    # Respuesta preflight OPTIONS gestionada directamente por el Reverse Proxy
    if ($request_method = OPTIONS) {
        return 204;
    }

    # 3. Bloquear metodos HTTP peligrosos o no utilizados
    if ($request_method !~ ^(GET|POST|OPTIONS|HEAD)$) {
        return 405;
    }

    # 4. Reglas WAF: Bloqueo de User-Agents de herramientas de ataque/escaneo
    if ($http_user_agent ~* "(sqlmap|nikto|nmap|masscan|dirbuster|gobuster|acunetix|nessus|openvas|havij)") {
        return 403;
    }

    # 5. Reglas WAF: Bloqueo de Path Traversal y acceso a archivos ocultos
    if ($request_uri ~* "(\.\./|\.\.\\|%2e%2e%2f|%252e|%00)") {
        return 403;
    }
    location ~ /\.(?!well-known) {
        deny all;
        return 404;
    }

    # 6. Reglas WAF: Bloqueo de patrones SQL Injection y XSS en Query String
    if ($query_string ~* "(union.*select|select.*from|insert.*into|drop.*table|update.*set|delete.*from|<script|%3Cscript|javascript:|onerror=|onload=)") {
        return 403;
    }

    # 7. Endpoints de escritura (POST /api/telemetry y /api/simulator/trigger) con Rate Limit estricto
    location ~ ^/api/(telemetry|simulator/trigger)$ {
        limit_req zone=backend_write_rate burst=20 nodelay;
        limit_conn backend_conn_limit 20;

        proxy_hide_header Access-Control-Allow-Origin;
        proxy_hide_header Access-Control-Allow-Methods;
        proxy_hide_header Access-Control-Allow-Headers;

        proxy_pass http://rust_core_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Inyeccion server-side de la API Key de Rust desde variable de entorno (.env)
        proxy_set_header X-API-Key "${SWIFTROUTE_API_KEY}";
    }

    # 8. Endpoint Server-Sent Events (SSE) en tiempo real (/api/sse/telemetry)
    location /api/sse/ {
        limit_conn backend_conn_limit 15;

        proxy_hide_header Access-Control-Allow-Origin;
        proxy_hide_header Access-Control-Allow-Methods;
        proxy_hide_header Access-Control-Allow-Headers;

        proxy_pass http://rust_core_upstream;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 86400s;
    }

    # 9. Proxy seguro hacia Apache Airflow REST API (inyecta Basic Auth desde .env en el servidor)
    location /api/airflow/ {
        limit_req zone=backend_write_rate burst=15 nodelay;
        limit_conn backend_conn_limit 10;

        proxy_hide_header Access-Control-Allow-Origin;
        proxy_hide_header Access-Control-Allow-Methods;
        proxy_hide_header Access-Control-Allow-Headers;

        proxy_pass http://airflow_internal_upstream/api/v1/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # Inyeccion server-side de credencial Basic Auth parametrizada en .env
        proxy_set_header Authorization "Basic ${AIRFLOW_BASIC_AUTH_B64}";
    }

    # 10. Endpoints generales de lectura REST y Swagger UI (/api/*, /swagger-ui)
    location / {
        limit_req zone=backend_api_rate burst=40 nodelay;
        limit_conn backend_conn_limit 30;

        proxy_hide_header Access-Control-Allow-Origin;
        proxy_hide_header Access-Control-Allow-Methods;
        proxy_hide_header Access-Control-Allow-Headers;

        proxy_pass http://rust_core_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
